name: OCI Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID to execute'
        required: true
        type: string
      server_url:
        description: 'Panel base URL'
        required: true
        type: string
      worker_token:
        description: 'One-time task-scoped worker token'
        required: true
        type: string

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Worker (Node)
        env:
          OCI_SERVER_URL: ${{ inputs.server_url }}
          OCI_WORKER_TOKEN: ${{ inputs.worker_token }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          node --version
          echo "Task $TASK_ID -> $OCI_SERVER_URL"
          curl -fsS -o /dev/null -w "health: %{http_code}\n" "$OCI_SERVER_URL/health" || echo "Warning: connectivity check failed"
          timeout 340m node worker/grab.mjs || true
