name: OCI Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID to execute'
        required: true
        type: string
      server_url:
        description: 'Panel base URL'
        required: true
        type: string
      worker_token:
        description: 'One-time task-scoped worker token'
        required: true
        type: string

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Download Worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download worker-build -R ${{ github.repository }} -p "oci-manager-worker-linux-amd64" --clobber
          mv oci-manager-worker-linux-amd64 oci-manager
          chmod +x oci-manager

      - name: Run Worker
        env:
          OCI_SERVER_URL: ${{ inputs.server_url }}
          OCI_WORKER_TOKEN: ${{ inputs.worker_token }}
          TASK_ID: ${{ inputs.task_id }}
          OCI_MANAGER_ENABLE_LEGACY_INLINE_OCI_KEYS: "true"  # worker 需要内联 OCI 私钥执行抢机
        run: |
          echo "Task $TASK_ID -> $OCI_SERVER_URL"
          curl -fsS -o /dev/null -w "health: %{http_code}\n" "$OCI_SERVER_URL/health" || echo "Warning: connectivity check failed"
          timeout 350m ./oci-manager worker --server-url "$OCI_SERVER_URL" --token "$OCI_WORKER_TOKEN" --task-id "$TASK_ID" || true
