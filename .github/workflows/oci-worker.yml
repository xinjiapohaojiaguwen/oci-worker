name: OCI Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID to execute'
        required: true
        type: string
      server_url:
        description: 'Panel base URL'
        required: true
        type: string
      bootstrap_code:
        description: 'One-time bootstrap code (exchanged for session token, dies on use)'
        required: true
        type: string

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs in logs
        run: |
          echo "::add-mask::${{ inputs.bootstrap_code }}"
          echo "::add-mask::${{ inputs.server_url }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Worker (Node)
        env:
          OCI_SERVER_URL: ${{ inputs.server_url }}
          BOOTSTRAP_CODE: ${{ inputs.bootstrap_code }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          node --version
          code=$(curl -s -o /dev/null -w "%{http_code}" "$OCI_SERVER_URL/api/v1/worker/task")
          echo "worker endpoint: HTTP $code (expect 401 unauthenticated)"
          timeout 340m node worker/grab.mjs || true
